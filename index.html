<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="App per gestione prima nota cassa">
    <meta name="theme-color" content="#2563eb">
    <title>Cassa</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- SheetJS for Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.min.js"></script>
    
    <!-- React -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <link rel="manifest" href="manifest.json">
    <style>
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif; }
        .hidden { display: none; }
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
    </style>
</head>
<body class="bg-gray-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            const [descrizioni, setDescrizioni] = useState([]);
            const [movimenti, setMovimenti] = useState([]);
            const [newMovimento, setNewMovimento] = useState({
                data: new Date().toISOString().split('T')[0],
                descrizione: '',
                importo: ''
            });
            const [filteredDescrizioni, setFilteredDescrizioni] = useState([]);
            const [showSuggestions, setShowSuggestions] = useState(false);
            const [loaded, setLoaded] = useState(false);
            const fileInputRef = useRef(null);
            const descrizioneInputRef = useRef(null);

            // Load data from localStorage
            useEffect(() => {
                const storedDescrizioni = localStorage.getItem('descrizioni');
                const storedMovimenti = localStorage.getItem('movimenti');
                
                if (storedDescrizioni) {
                    setDescrizioni(JSON.parse(storedDescrizioni));
                    setLoaded(true);
                }
                
                if (storedMovimenti) {
                    setMovimenti(JSON.parse(storedMovimenti));
                }
            }, []);

            // Save movimenti to localStorage whenever they change
            useEffect(() => {
                localStorage.setItem('movimenti', JSON.stringify(movimenti));
            }, [movimenti]);

            // Handle Excel file load
            const loadExcelFile = (event) => {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        
                        // Look for "codici personali" sheet
                        let sheet = workbook.Sheets['codici personali'];
                        if (!sheet) {
                            // Try first sheet
                            sheet = workbook.Sheets[workbook.SheetNames[0]];
                        }
                        
                        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });
                        
                        // Extract descriptions from column A (index 0)
                        const descs = rows
                            .slice(1) // Skip header
                            .filter(row => row[0] && row[0].toString().trim())
                            .map(row => {
                                const cognome = row[0] ? row[0].toString().trim() : '';
                                const nome = row[1] ? row[1].toString().trim() : '';
                                return nome ? `${cognome} ${nome}` : cognome;
                            })
                            .filter(d => d && d.length > 0)
                            .sort();
                        
                        setDescrizioni(descs);
                        localStorage.setItem('descrizioni', JSON.stringify(descs));
                        setLoaded(true);
                        alert(`✓ Caricate ${descs.length} descrizioni`);
                    } catch (error) {
                        alert('Errore nel caricamento del file: ' + error.message);
                    }
                };
                reader.readAsArrayBuffer(file);
            };

            // Filter descriptions based on input
            const handleDescrzioneChange = (value) => {
                setNewMovimento({ ...newMovimento, descrizione: value });
                
                if (value.length > 0) {
                    const filtered = descrizioni.filter(d => 
                        d.toLowerCase().includes(value.toLowerCase())
                    );
                    setFilteredDescrizioni(filtered);
                    setShowSuggestions(true);
                } else {
                    setShowSuggestions(false);
                }
            };

            const selectDescrizione = (desc) => {
                setNewMovimento({ ...newMovimento, descrizione: desc });
                setShowSuggestions(false);
            };

            const resetDescrizioni = () => {
                if (confirm('Vuoi ricaricare le descrizioni dal file Excel?')) {
                    localStorage.removeItem('descrizioni');
                    setDescrizioni([]);
                    setLoaded(false);
                }
            };

            // Add movimento
            const addMovimento = () => {
                if (!newMovimento.data || !newMovimento.descrizione || !newMovimento.importo) {
                    alert('Compila tutti i campi');
                    return;
                }

                const importo = parseFloat(newMovimento.importo);
                if (isNaN(importo)) {
                    alert('Importo non valido');
                    return;
                }

                setMovimenti([...movimenti, {
                    data: newMovimento.data,
                    descrizione: newMovimento.descrizione,
                    importo: importo
                }]);

                // Reset form
                setNewMovimento({
                    data: new Date().toISOString().split('T')[0],
                    descrizione: '',
                    importo: ''
                });
            };

            const deleteMovimento = (index) => {
                setMovimenti(movimenti.filter((_, i) => i !== index));
            };

            const downloadCSV = () => {
                if (movimenti.length === 0) {
                    alert('Nessun movimento da esportare');
                    return;
                }

                let csv = 'Data,Descrizione,Importo\n';
                
                movimenti.forEach(mov => {
                    const [anno, mese, giorno] = mov.data.split('-');
                    const dataFormattata = `${giorno}/${mese}/${anno}`;
                    const importoFormattato = mov.importo.toFixed(2);
                    csv += `${dataFormattata},"${mov.descrizione}",${importoFormattato}\n`;
                });

                const timestamp = new Date().toISOString().slice(0, 19).replace(/:/g, '-');
                const filename = `movimenti_${timestamp}.csv`;
                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                
                if (navigator.msSaveBlob) {
                    navigator.msSaveBlob(blob, filename);
                } else {
                    const url = URL.createObjectURL(blob);
                    link.setAttribute('href', url);
                    link.setAttribute('download', filename);
                    link.style.visibility = 'hidden';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                }
            };

            const clearAllMovimenti = () => {
                if (confirm('Cancellare TUTTI i movimenti? Questa azione non si può annullare.')) {
                    setMovimenti([]);
                }
            };

            return (
                <div className="min-h-screen bg-gray-100 pb-20">
                    <div className="max-w-2xl mx-auto p-4">
                        {/* Header */}
                        <div className="bg-blue-600 text-white rounded-lg shadow-lg p-6 mb-6">
                            <h1 className="text-4xl font-bold mb-2">Cassa</h1>
                            <p className="text-blue-100 text-sm">Prima Nota - Gestione Contante</p>
                        </div>

                        {/* Load Excel Section */}
                        {!loaded && (
                            <div className="bg-yellow-50 border-2 border-yellow-200 rounded-lg p-4 mb-4">
                                <p className="text-sm text-yellow-800 mb-3 font-semibold">
                                    ℹ️ Setup Iniziale
                                </p>
                                <p className="text-xs text-yellow-700 mb-4">
                                    Carica il file Excel per importare le descrizioni. 
                                    Devi farlo solo la prima volta!
                                </p>
                                <input
                                    ref={fileInputRef}
                                    type="file"
                                    accept=".xlsx,.xls"
                                    onChange={loadExcelFile}
                                    className="hidden"
                                />
                                <button
                                    onClick={() => fileInputRef.current?.click()}
                                    className="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold active:bg-blue-700"
                                >
                                    Carica File Excel
                                </button>
                            </div>
                        )}

                        {/* Info descrizioni caricate */}
                        {loaded && (
                            <div className="bg-green-50 border border-green-200 rounded-lg p-3 mb-4">
                                <div className="flex items-center justify-between">
                                    <div>
                                        <p className="text-sm text-green-800 font-semibold">✓ Descrizioni caricate</p>
                                        <p className="text-xs text-green-600">{descrizioni.length} voci disponibili</p>
                                    </div>
                                    <button
                                        onClick={resetDescrizioni}
                                        className="text-blue-600 text-sm font-semibold"
                                    >
                                        Ricarica
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* Form Inserimento */}
                        {loaded && (
                            <div className="bg-white rounded-lg shadow-md p-4 mb-4">
                                <h2 className="text-lg font-semibold mb-4">➕ Nuovo Movimento</h2>
                                
                                <div className="space-y-3">
                                    {/* Data */}
                                    <div>
                                        <label className="block text-sm font-semibold mb-1">Data</label>
                                        <input
                                            type="date"
                                            value={newMovimento.data}
                                            onChange={(e) => setNewMovimento({ ...newMovimento, data: e.target.value })}
                                            className="w-full border border-gray-300 rounded-lg p-3 text-base"
                                        />
                                    </div>

                                    {/* Descrizione */}
                                    <div>
                                        <label className="block text-sm font-semibold mb-1">Descrizione</label>
                                        <div className="relative">
                                            <input
                                                ref={descrizioneInputRef}
                                                type="text"
                                                value={newMovimento.descrizione}
                                                onChange={(e) => handleDescrzioneChange(e.target.value)}
                                                onFocus={() => newMovimento.descrizione && setShowSuggestions(true)}
                                                className="w-full border border-gray-300 rounded-lg p-3 text-base"
                                                placeholder="Digita per cercare..."
                                            />
                                            
                                            {/* Suggestions */}
                                            {showSuggestions && filteredDescrizioni.length > 0 && (
                                                <div className="absolute top-full left-0 right-0 bg-white border border-gray-300 rounded-lg mt-1 max-h-48 overflow-y-auto z-10">
                                                    {filteredDescrizioni.map((desc, i) => (
                                                        <button
                                                            key={i}
                                                            onClick={() => selectDescrizione(desc)}
                                                            className="w-full text-left px-4 py-2 hover:bg-blue-100 active:bg-blue-200 text-sm"
                                                        >
                                                            {desc}
                                                        </button>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    </div>

                                    {/* Importo */}
                                    <div>
                                        <label className="block text-sm font-semibold mb-1">Importo (+ entrata / - uscita)</label>
                                        <input
                                            type="number"
                                            step="0.01"
                                            value={newMovimento.importo}
                                            onChange={(e) => setNewMovimento({ ...newMovimento, importo: e.target.value })}
                                            className="w-full border border-gray-300 rounded-lg p-3 text-base"
                                            placeholder="Es: 100 o -50.50"
                                        />
                                    </div>

                                    {/* Add Button */}
                                    <button
                                        onClick={addMovimento}
                                        className="w-full bg-green-600 text-white py-3 rounded-lg font-semibold active:bg-green-700"
                                    >
                                        ✓ Aggiungi Movimento
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* Movimenti List */}
                        {movimenti.length > 0 && (
                            <div className="bg-white rounded-lg shadow-md p-4 mb-4">
                                <h2 className="text-lg font-semibold mb-4">📋 Movimenti Inseriti ({movimenti.length})</h2>
                                
                                <div className="space-y-2 max-h-96 overflow-y-auto mb-4">
                                    {movimenti.map((mov, i) => (
                                        <div key={i} className="flex items-center justify-between p-3 bg-gray-50 rounded border border-gray-200">
                                            <div className="flex-1 min-w-0">
                                                <div className="text-sm font-semibold text-gray-700">{mov.descrizione}</div>
                                                <div className="text-xs text-gray-500">
                                                    {new Date(mov.data).toLocaleDateString('it-IT')} · 
                                                    <span className={mov.importo > 0 ? ' text-green-600' : ' text-red-600'}>
                                                        {mov.importo > 0 ? '+' : ''}{mov.importo.toFixed(2)}
                                                    </span>
                                                </div>
                                            </div>
                                            <button
                                                onClick={() => deleteMovimento(i)}
                                                className="text-red-600 text-2xl ml-2 px-2"
                                            >
                                                ×
                                            </button>
                                        </div>
                                    ))}
                                </div>

                                {/* Action Buttons */}
                                <div className="flex gap-2">
                                    <button
                                        onClick={downloadCSV}
                                        className="flex-1 bg-blue-600 text-white py-3 rounded-lg font-semibold active:bg-blue-700"
                                    >
                                        📥 Scarica CSV
                                    </button>
                                    <button
                                        onClick={clearAllMovimenti}
                                        className="flex-1 bg-red-600 text-white py-3 rounded-lg font-semibold active:bg-red-700"
                                    >
                                        🗑️ Cancella tutti
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* Info Section */}
                        {loaded && movimenti.length === 0 && (
                            <div className="bg-blue-50 border border-blue-200 rounded-lg p-4 text-center">
                                <p className="text-sm text-blue-800">
                                    👆 Inserisci il primo movimento per iniziare!
                                </p>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
